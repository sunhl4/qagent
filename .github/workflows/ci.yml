name: company-agent-ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - run: corepack enable
      - run: python -m pip install --require-hashes -r runtime/python-dev.lock
      - run: bash scripts/bootstrap_dsh.sh
      - run: python scripts/verify_acceptance.py
