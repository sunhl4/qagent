name: qagent-eval
on:
  push:
  pull_request:
jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qagent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash scripts/ci_eval.sh
