<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1040" viewBox="0 0 1700 1040" role="img" aria-labelledby="title desc">
<title id="title">&#x56FE;3 &#x8BF7;&#x6C42;&#x72B6;&#x6001;&#x8FC1;&#x79FB;</title>
<desc id="desc">Request states: software accepted, device accepted, started, running, completed, terminated after start, closed before start, unknown, and replacement pending registration.</desc>
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#243746"/></marker>
<marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2f6f9f"/></marker>
<marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3c7d55"/></marker>
<marker id="r" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#a63d40"/></marker>
<style>
.title{font-family:Arial,sans-serif;font-size:29px;font-weight:700;fill:#1f2933}.sub{font-family:Arial,sans-serif;font-size:15px;fill:#52606d}.frame{fill:#fbfcfd;stroke:#d8e0e5;stroke-width:1.5}.box{fill:#fff;stroke:#435563;stroke-width:2}.blue{fill:#f3f8fc;stroke:#2f6f9f;stroke-width:2}.green{fill:#f3f8f5;stroke:#3c7d55;stroke-width:2}.warm{fill:#fffaf0;stroke:#9a7b2f;stroke-width:2}.red{fill:#fff5f4;stroke:#a63d40;stroke-width:2}.t{font-family:Arial,sans-serif;font-size:17px;font-weight:700;fill:#1f2933}.c{font-family:Consolas,"Courier New",monospace;font-size:12px;fill:#52606d}.s{font-family:Arial,sans-serif;font-size:12px;fill:#52606d}.line{fill:none;stroke:#243746;stroke-width:2.3;marker-end:url(#a)}.bl{fill:none;stroke:#2f6f9f;stroke-width:2.3;marker-end:url(#b)}.gr{fill:none;stroke:#3c7d55;stroke-width:2.3;marker-end:url(#g)}.rd{fill:none;stroke:#a63d40;stroke-width:2.3;stroke-dasharray:9 6;marker-end:url(#r)}.lab{font-family:Arial,sans-serif;font-size:13px;fill:#374957}.labr{font-family:Arial,sans-serif;font-size:13px;fill:#a63d40}.note{fill:#fffdf7;stroke:#d8c27a;stroke-width:1.5}.nt{font-family:Arial,sans-serif;font-size:14px;font-weight:700;fill:#735e24}.nx{font-family:Arial,sans-serif;font-size:13px;fill:#5d5745}.badge{fill:#243746}.bt{font-family:Arial,sans-serif;font-size:12px;font-weight:700;fill:#fff}
</style>
</defs>
<rect width="1700" height="1040" fill="#fff"/>
<text x="850" y="44" text-anchor="middle" class="title">&#x56FE;3 &#x8BF7;&#x6C42;&#x72B6;&#x6001;&#x8FC1;&#x79FB;</text>
<text x="850" y="72" text-anchor="middle" class="sub">Software facts and device facts are separated; STARTED is irreversible and UNKNOWN cannot trigger replacement</text>
<rect x="55" y="108" width="1590" height="500" rx="12" class="frame"/><text x="82" y="142" class="t">NORMAL EXECUTION CHAIN</text>
<g transform="translate(85 220)"><rect width="260" height="125" rx="10" class="blue"/><circle cx="23" cy="23" r="16" class="badge"/><text x="23" y="27" text-anchor="middle" class="bt">S1</text><text x="23" y="58" class="t">&#x8F6F;&#x4EF6;&#x5DF2;&#x63A5;&#x6536;</text><text x="23" y="82" class="c">SOFTWARE_ACCEPTED</text><text x="23" y="105" class="s">software record only</text></g>
<g transform="translate(405 220)"><rect width="260" height="125" rx="10" class="blue"/><circle cx="23" cy="23" r="16" class="badge"/><text x="23" y="27" text-anchor="middle" class="bt">S2</text><text x="23" y="58" class="t">&#x8BBE;&#x5907;&#x5DF2;&#x63A5;&#x6536;</text><text x="23" y="82" class="c">DEVICE_ACCEPTED</text><text x="23" y="105" class="s">received, not started</text></g>
<g transform="translate(725 220)"><rect width="260" height="125" rx="10" class="green"/><circle cx="23" cy="23" r="16" class="badge"/><text x="23" y="27" text-anchor="middle" class="bt">S3</text><text x="23" y="58" class="t">&#x5DF2;&#x542F;&#x52A8;</text><text x="23" y="82" class="c">STARTED</text><text x="23" y="105" class="s">authoritative device fact</text></g>
<g transform="translate(1045 220)"><rect width="260" height="125" rx="10" class="green"/><circle cx="23" cy="23" r="16" class="badge"/><text x="23" y="27" text-anchor="middle" class="bt">S4</text><text x="23" y="58" class="t">&#x8FD0;&#x884C;&#x4E2D;</text><text x="23" y="82" class="c">RUNNING</text><text x="23" y="105" class="s">continue tracking</text></g>
<path d="M345 282H405" class="bl"/><text x="375" y="272" text-anchor="middle" class="lab">device receive</text><path d="M665 282H725" class="gr"/><text x="695" y="272" text-anchor="middle" class="lab">start evidence</text><path d="M985 282H1045" class="gr"/><text x="1015" y="272" text-anchor="middle" class="lab">running</text>
<g transform="translate(725 440)"><rect width="260" height="125" rx="10" class="green"/><circle cx="23" cy="23" r="16" class="badge"/><text x="23" y="27" text-anchor="middle" class="bt">S5</text><text x="23" y="58" class="t">&#x5DF2;&#x5B8C;&#x6210;</text><text x="23" y="82" class="c">COMPLETED</text><text x="23" y="105" class="s">keep start evidence</text></g>
<g transform="translate(1045 440)"><rect width="260" height="125" rx="10" class="red"/><circle cx="23" cy="23" r="16" class="badge"/><text x="23" y="27" text-anchor="middle" class="bt">S6</text><text x="23" y="58" class="t">&#x542F;&#x52A8;&#x540E;&#x7EC8;&#x6B62;</text><text x="23" y="82" class="c">TERMINATED_AFTER_START</text><text x="23" y="105" class="s">keep start evidence</text></g>
<path d="M1175 345V440" class="gr"/><text x="1192" y="395" class="lab">completed</text><path d="M1305 345C1380 390 1380 430 1305 440" class="rd"/><text x="1450" y="400" text-anchor="middle" class="labr">fault after start</text>
<g transform="translate(1360 220)"><rect width="220" height="125" rx="10" class="warm"/><circle cx="23" cy="23" r="16" class="badge"/><text x="23" y="27" text-anchor="middle" class="bt">S7</text><text x="23" y="58" class="t">&#x5173;&#x95ED;&#x524D;&#x672A;&#x542F;&#x52A8;</text><text x="23" y="82" class="c">CLOSED_BEFORE_START</text><text x="23" y="105" class="s">cannot start later</text></g>
<path d="M665 220C900 145 1260 145 1360 220" class="gr"/><text x="1040" y="155" text-anchor="middle" class="lab">device confirms closed and not restartable</text>
<rect x="55" y="650" width="1590" height="255" rx="12" class="frame"/><text x="82" y="684" class="t">RECOVERY BRANCH</text>
<g transform="translate(110 735)"><rect width="350" height="110" rx="10" class="red"/><circle cx="23" cy="23" r="16" class="badge"/><text x="23" y="27" text-anchor="middle" class="bt">S8</text><text x="23" y="58" class="t">&#x72B6;&#x6001;&#x4E0D;&#x660E;</text><text x="23" y="82" class="c">UNKNOWN</text><text x="23" y="101" class="s">pause; never auto-replace</text></g>
<g transform="translate(620 735)"><rect width="430" height="110" rx="10" class="warm"/><circle cx="23" cy="23" r="16" class="badge"/><text x="23" y="27" text-anchor="middle" class="bt">S9</text><text x="23" y="58" class="t">&#x66FF;&#x4EE3;&#x5173;&#x7CFB;&#x5F85;&#x767B;&#x8BB0;</text><text x="23" y="82" class="c">REPLACED_PENDING_REGISTRATION</text><text x="23" y="101" class="s">R1-R2 exists; R2 blocked</text></g>
<g transform="translate(1210 735)"><rect width="350" height="110" rx="10" class="blue"/><circle cx="23" cy="23" r="16" class="badge"/><text x="23" y="27" text-anchor="middle" class="bt">D</text><text x="23" y="58" class="t">Recovery decision</text><text x="23" y="82" class="c">RECOVERY_DECISION</text><text x="23" y="101" class="s">only S7 may enter</text></g>
<path d="M215 565C215 650 260 690 285 735" class="rd"/><text x="160" y="650" class="labr">query failure or conflict</text><path d="M1470 345C1540 500 1450 650 1385 735" class="gr"/><text x="1500" y="565" class="lab">only S7</text><path d="M1210 790H1050" class="bl"/><text x="1130" y="780" text-anchor="middle" class="lab">serialize U1, then register R2</text>
<rect x="55" y="940" width="1590" height="58" rx="8" class="note"/><text x="78" y="964" class="nt">&#x72C4;&#x5219;:</text><text x="145" y="964" class="nx">SOFTWARE_ACCEPTED is not DEVICE_ACCEPTED; DEVICE_ACCEPTED is not STARTED; STARTED cannot revert; UNKNOWN cannot become not-started.</text><text x="145" y="985" class="nx">Only CLOSED_BEFORE_START with device evidence that restart is impossible may enter replacement.</text>
</svg>
