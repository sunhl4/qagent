<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1080" viewBox="0 0 1700 1080" role="img" aria-labelledby="title desc">
<title id="title">&#x56FE;4 &#x66FF;&#x4EE3;&#x8BF7;&#x6C42;&#x4E32;&#x884C;&#x5316;&#x6D41;&#x7A0B;</title>
<desc id="desc">Serialized U1 flow: lock, read R1 E2 A2, close device request, persist evidence, recheck authorization, write relation, register R2, release lock; failures pause U1.</desc>
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#243746"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2f6f9f"/></marker><marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3c7d55"/></marker><marker id="r" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#a63d40"/></marker>
<style>
.title{font-family:Arial,sans-serif;font-size:29px;font-weight:700;fill:#1f2933}.sub{font-family:Arial,sans-serif;font-size:15px;fill:#52606d}.frame{fill:#fbfcfd;stroke:#d8e0e5;stroke-width:1.5}.box{fill:#fff;stroke:#435563;stroke-width:2}.blue{fill:#f3f8fc;stroke:#2f6f9f;stroke-width:2}.green{fill:#f3f8f5;stroke:#3c7d55;stroke-width:2}.warm{fill:#fffaf0;stroke:#9a7b2f;stroke-width:2}.red{fill:#fff5f4;stroke:#a63d40;stroke-width:2}.t{font-family:Arial,sans-serif;font-size:17px;font-weight:700;fill:#1f2933}.c{font-family:Consolas,"Courier New",monospace;font-size:12px;fill:#52606d}.s{font-family:Arial,sans-serif;font-size:13px;fill:#52606d}.line{fill:none;stroke:#243746;stroke-width:2.3;marker-end:url(#a)}.bl{fill:none;stroke:#2f6f9f;stroke-width:2.3;marker-end:url(#b)}.gr{fill:none;stroke:#3c7d55;stroke-width:2.3;marker-end:url(#g)}.rd{fill:none;stroke:#a63d40;stroke-width:2.3;stroke-dasharray:9 6;marker-end:url(#r)}.lab{font-family:Arial,sans-serif;font-size:13px;fill:#374957}.note{fill:#fffdf7;stroke:#d8c27a;stroke-width:1.5}.nt{font-family:Arial,sans-serif;font-size:14px;font-weight:700;fill:#735e24}.nx{font-family:Arial,sans-serif;font-size:13px;fill:#5d5745}.badge{fill:#243746}.bt{font-family:Arial,sans-serif;font-size:14px;font-weight:700;fill:#fff}
</style>
</defs>
<rect width="1700" height="1080" fill="#fff"/>
<text x="850" y="44" text-anchor="middle" class="title">&#x56FE;4 &#x66FF;&#x4EE3;&#x8BF7;&#x6C42;&#x4E32;&#x884C;&#x5316;&#x6D41;&#x7A0B;</text>
<text x="850" y="72" text-anchor="middle" class="sub">U1 is the serialization boundary; R2 is admitted only after R1 is closed and not restartable</text>
<rect x="55" y="108" width="1590" height="825" rx="14" class="frame"/><text x="82" y="145" class="t">&#x6267;&#x884C;&#x5355;&#x5143; U1 &#x7684;&#x4FDD;&#x62A4;&#x533A;</text><text x="82" y="169" class="s">Recheck authorization and approval before each persistent write. An uncertain R2 submission never creates R3.</text>
<g transform="translate(140 215)"><rect width="410" height="88" rx="10" class="blue"/><circle cx="31" cy="44" r="21" class="badge"/><text x="31" y="49" text-anchor="middle" class="bt">1</text><text x="70" y="36" class="t">&#x9501;&#x5B9A; U1</text><text x="70" y="61" class="s">mutex, lease, or equivalent serialization</text><text x="70" y="79" class="c">key = task_id + execution_unit_id</text></g><path d="M345 303V342" class="line"/>
<g transform="translate(140 342)"><rect width="410" height="88" rx="10" class="box"/><circle cx="31" cy="44" r="21" class="badge"/><text x="31" y="49" text-anchor="middle" class="bt">2</text><text x="70" y="36" class="t">&#x8BFB;&#x53D6; R1, E2, A2</text><text x="70" y="61" class="s">original state, current authorization, approval</text><text x="70" y="79" class="c">R1 / authorization_no / approval_id</text></g><path d="M345 430V469" class="line"/>
<g transform="translate(140 469)"><rect width="410" height="88" rx="10" class="blue"/><circle cx="31" cy="44" r="21" class="badge"/><text x="31" y="49" text-anchor="middle" class="bt">3</text><text x="70" y="36" class="t">&#x5173;&#x95ED;&#x6216;&#x53D6;&#x6D88; R1</text><text x="70" y="61" class="s">use R1 as device query and close key</text><text x="70" y="79" class="c">close(R1) -&gt; device evidence</text></g><path d="M345 557V596" class="line"/>
<g transform="translate(140 596)"><rect width="410" height="88" rx="10" class="green"/><circle cx="31" cy="44" r="21" class="badge"/><text x="31" y="49" text-anchor="middle" class="bt">4</text><text x="70" y="36" class="t">&#x6301;&#x4E45;&#x5316;&#x5173;&#x95ED;&#x8BC1;&#x636E;</text><text x="70" y="61" class="s">R1 not started and not restartable</text><text x="70" y="79" class="c">CLOSED_BEFORE_START + evidence_ref</text></g><path d="M345 684V723" class="line"/>
<g transform="translate(140 723)"><rect width="410" height="88" rx="10" class="blue"/><circle cx="31" cy="44" r="21" class="badge"/><text x="31" y="49" text-anchor="middle" class="bt">5</text><text x="70" y="36" class="t">&#x590D;&#x6838; E2 &#x548C; A2</text><text x="70" y="61" class="s">authorization and approval must still match</text><text x="70" y="79" class="c">current_E == E2 &amp;&amp; current_A == A2</text></g>
<path d="M550 767H740" class="bl"/><text x="645" y="756" text-anchor="middle" class="lab">recheck passed</text>
<g transform="translate(740 723)"><rect width="410" height="88" rx="10" class="warm"/><circle cx="31" cy="44" r="21" class="badge"/><text x="31" y="49" text-anchor="middle" class="bt">6</text><text x="70" y="36" class="t">&#x5199;&#x5165; R1-R2 &#x5173;&#x7CFB;</text><text x="70" y="61" class="s">R1 history retained; R2 keeps I1 and U1</text><text x="70" y="79" class="c">replaces_request_id = R1</text></g><path d="M945 811V850" class="line"/>
<g transform="translate(740 850)"><rect width="410" height="88" rx="10" class="blue"/><circle cx="31" cy="44" r="21" class="badge"/><text x="31" y="49" text-anchor="middle" class="bt">7</text><text x="70" y="36" class="t">&#x767B;&#x8BB0; R2&#xFF0C;&#x91CA;&#x653E; U1</text><text x="70" y="61" class="s">persist software acceptance, then release control</text><text x="70" y="79" class="c">register(R2) -&gt; release(U1)</text></g>
<rect x="665" y="215" width="850" height="360" rx="12" fill="#fffafb" stroke="#ead2d4" stroke-width="1.5"/><text x="695" y="251" class="t">&#x5931;&#x8D25;&#x5206;&#x652F;&#xFF1A;&#x4FDD;&#x7559; R1 &#x5E76;&#x6682;&#x505C; U1</text><text x="695" y="277" class="s">The following failures do not overwrite R1 and do not create R3.</text>
<g transform="translate(705 310)"><rect width="350" height="62" rx="8" class="red"/><text x="20" y="26" class="t">Lock or lease failure</text><text x="20" y="48" class="s">U1 has no current serialization right</text></g><g transform="translate(1110 310)"><rect width="350" height="62" rx="8" class="red"/><text x="20" y="26" class="t">Close result unknown</text><text x="20" y="48" class="s">no not-restartable evidence</text></g><g transform="translate(705 405)"><rect width="350" height="62" rx="8" class="red"/><text x="20" y="26" class="t">E2 or A2 changed</text><text x="20" y="48" class="s">current authorization no longer matches</text></g><g transform="translate(1110 405)"><rect width="350" height="62" rx="8" class="red"/><text x="20" y="26" class="t">Relation or R2 write fails</text><text x="20" y="48" class="s">partial new state is not accepted</text></g>
<path d="M880 372V405" class="rd"/><path d="M1285 372V405" class="rd"/><path d="M880 467V520H1060" class="rd"/><path d="M1285 467V520H1060" class="rd"/><rect x="830" y="520" width="460" height="62" rx="8" class="red"/><text x="1060" y="547" text-anchor="middle" class="nt">U1 = PAUSED</text><text x="1060" y="568" text-anchor="middle" class="nx">retain R1, failure reason, recovery entry</text>
<path d="M1150 894C1300 894 1310 850 1310 780" class="gr"/><rect x="1220" y="650" width="335" height="120" rx="10" class="green"/><text x="1245" y="680" class="t">After R2 registration</text><text x="1245" y="705" class="s">R2 still passes through quantum ingress</text><text x="1245" y="727" class="s">and current E/A checks.</text><text x="1245" y="749" class="s">Uncertain result: query R2, no R3.</text>
<rect x="55" y="965" width="1590" height="58" rx="8" class="note"/><text x="78" y="989" class="nt">&#x6570;&#x636E;&#x89C4;&#x5219;:</text><text x="160" y="989" class="nx">R1 and R2 share I1 and U1. R2 references R1 close evidence and replacement reason; R1 is never deleted.</text><text x="160" y="1010" class="nx">A timeout or a lock expiry proves neither device closure nor non-start.</text>
</svg>
