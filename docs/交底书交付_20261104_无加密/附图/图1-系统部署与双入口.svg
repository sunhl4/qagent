<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">图1 系统部署与双入口共同确认关系</title>
<desc id="desc">展示任务登记、接管授权、共同批准、两个执行入口、调度器和量子设备。</desc>
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#243746"/></marker>
<marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2f6f9f"/></marker>
<marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3c7d55"/></marker>
<style>
.title{font-family:Arial,sans-serif;font-size:29px;font-weight:700;fill:#1f2933;letter-spacing:1px}.sub{font-family:Arial,sans-serif;font-size:15px;fill:#52606d}.band{fill:#f8fafb;stroke:#d8e0e5;stroke-width:1.5}.bt{font-family:Arial,sans-serif;font-size:16px;font-weight:700;fill:#52606d}.n{fill:#fff;stroke:#435563;stroke-width:2}.blue{fill:#f3f8fc;stroke:#2f6f9f;stroke-width:2}.green{fill:#f3f8f5;stroke:#3c7d55;stroke-width:2}.warm{fill:#fffaf0;stroke:#9a7b2f;stroke-width:2}.dark{fill:#f5f7f8;stroke:#243746;stroke-width:2}.nt{font-family:Arial,sans-serif;font-size:17px;font-weight:700;fill:#1f2933}.ns{font-family:Arial,sans-serif;font-size:13px;fill:#52606d}.mk{font-family:Arial,sans-serif;font-size:12px;font-weight:700;fill:#fff}.mc{fill:#243746}.flow{fill:none;stroke:#243746;stroke-width:2.4;marker-end:url(#a)}.ap{fill:none;stroke:#2f6f9f;stroke-width:2.4;marker-end:url(#b)}.qry{fill:none;stroke:#3c7d55;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#g)}.el{font-family:Arial,sans-serif;font-size:13px;fill:#374957}.note{fill:#fffdf7;stroke:#d8c27a;stroke-width:1.5}.ntext{font-family:Arial,sans-serif;font-size:13px;fill:#5d5745}.leg{font-family:Arial,sans-serif;font-size:12px;fill:#52606d}
</style>
</defs>
<rect width="1600" height="980" fill="#fff"/>
<text x="800" y="44" text-anchor="middle" class="title">图1 系统部署与双入口共同确认关系</text>
<text x="800" y="72" text-anchor="middle" class="sub">量子请求必经入口、持久授权围栏与设备事实</text>
<rect x="42" y="105" width="1516" height="350" rx="12" class="band"/><text x="68" y="137" class="bt">控制平面</text>
<rect x="42" y="480" width="1516" height="330" rx="12" class="band"/><text x="68" y="512" class="bt">执行与调度平面</text>
<path d="M320 220H360" class="flow"/><text x="340" y="205" text-anchor="middle" class="el">task and identity</text>
<path d="M610 220H650" class="ap"/><text x="630" y="205" text-anchor="middle" class="el">current E</text>
<path d="M900 220H940" class="ap"/><text x="920" y="205" text-anchor="middle" class="el">approval</text>
<path d="M1190 220H1230" class="qry"/><text x="1210" y="205" text-anchor="middle" class="el">history</text>
<path d="M320 275 C520 330 760 330 940 275" class="qry"/><text x="630" y="346" text-anchor="middle" class="el">register task, unit, and history</text>
<g transform="translate(72 170)"><rect width="248" height="112" rx="10" class="n"/><circle cx="24" cy="23" r="16" class="mc"/><text x="24" y="27" text-anchor="middle" class="mk">101</text><text x="24" y="58" class="nt">协同任务登记</text><text x="24" y="82" class="ns">task, I, U, batch, resource</text><text x="24" y="101" class="ns">payload digest and binding</text></g>
<g transform="translate(360 170)"><rect width="250" height="112" rx="10" class="blue"/><circle cx="24" cy="23" r="16" class="mc"/><text x="24" y="27" text-anchor="middle" class="mk">102</text><text x="24" y="58" class="nt">接管授权</text><text x="24" y="82" class="ns">persisted E sequence</text><text x="24" y="101" class="ns">reject lower E</text></g>
<g transform="translate(650 170)"><rect width="250" height="112" rx="10" class="blue"/><circle cx="24" cy="23" r="16" class="mc"/><text x="24" y="27" text-anchor="middle" class="mk">103</text><text x="24" y="58" class="nt">共同执行批准</text><text x="24" y="82" class="ns">classical and quantum confirm</text><text x="24" y="101" class="ns">same task, U, E, window</text></g>
<g transform="translate(940 170)"><rect width="250" height="112" rx="10" class="green"/><circle cx="24" cy="23" r="16" class="mc"/><text x="24" y="27" text-anchor="middle" class="mk">106</text><text x="24" y="58" class="nt">执行历史存储</text><text x="24" y="82" class="ns">R, E, A, device facts</text><text x="24" y="101" class="ns">source and event time</text></g>
<g transform="translate(1230 170)"><rect width="250" height="112" rx="10" class="warm"/><circle cx="24" cy="23" r="16" class="mc"/><text x="24" y="27" text-anchor="middle" class="mk">107</text><text x="24" y="58" class="nt">恢复判定</text><text x="24" y="82" class="ns">return, follow, close, pause</text><text x="24" y="101" class="ns">or replacement</text></g>
<path d="M485 282V585" class="ap"/><text x="502" y="430" class="el">confirm E</text><path d="M775 282V585" class="ap"/><text x="792" y="430" class="el">confirm A</text><path d="M1355 282V585" class="qry"/><text x="1372" y="430" class="el">decision</text><path d="M1230 278 C1180 405 1070 440 875 585" class="qry"/><text x="1070" y="430" class="el">history query</text>
<path d="M455 648H1000" class="flow"/><text x="725" y="635" text-anchor="middle" class="el">classical workload control</text><path d="M870 694 C940 694 1030 694 1110 770" class="ap"/><text x="985" y="718" text-anchor="middle" class="el">all quantum requests enter at 105</text><path d="M1370 648 C1330 690 1305 720 1290 770" class="qry"/><text x="1360" y="720" text-anchor="middle" class="el">resource and status</text><path d="M1110 810H870" class="qry"/><text x="990" y="800" text-anchor="middle" class="el">device receive, start, complete, close</text>
<g transform="translate(180 585)"><rect width="275" height="130" rx="10" class="blue"/><circle cx="24" cy="23" r="16" class="mc"/><text x="24" y="27" text-anchor="middle" class="mk">104</text><text x="24" y="61" class="nt">经典任务启动入口</text><text x="24" y="86" class="ns">HPC resource and E confirm</text><text x="24" y="108" class="ns">start or continue workload</text></g>
<g transform="translate(570 585)"><rect width="300" height="130" rx="10" class="blue"/><circle cx="24" cy="23" r="16" class="mc"/><text x="24" y="27" text-anchor="middle" class="mk">105</text><text x="24" y="61" class="nt">量子任务接收入口</text><text x="24" y="86" class="ns">check E, A, I, U, history</text><text x="24" y="108" class="ns">serialize, accept, reject</text></g>
<g transform="translate(1000 585)"><rect width="240" height="130" rx="10" class="dark"/><circle cx="24" cy="23" r="16" class="mc"/><text x="24" y="27" text-anchor="middle" class="mk">108</text><text x="24" y="61" class="nt">HPC scheduler</text><text x="24" y="86" class="ns">classical allocation</text><text x="24" y="108" class="ns">workload state</text></g>
<g transform="translate(1300 585)"><rect width="240" height="130" rx="10" class="dark"/><circle cx="24" cy="23" r="16" class="mc"/><text x="24" y="27" text-anchor="middle" class="mk">109</text><text x="24" y="61" class="nt">QPU scheduler</text><text x="24" y="86" class="ns">quantum allocation</text><text x="24" y="108" class="ns">queue and device state</text></g>
<g transform="translate(1100 770)"><rect width="390" height="64" rx="10" class="green"/><circle cx="24" cy="32" r="16" class="mc"/><text x="24" y="36" text-anchor="middle" class="mk">110</text><text x="58" y="28" class="nt">量子设备或测控控制器</text><text x="58" y="49" class="ns">R-based device evidence</text></g>
<rect x="70" y="855" width="1460" height="58" rx="8" class="note"/><text x="92" y="879" class="nt">关键边界:</text><text x="185" y="879" class="ntext">105 reads 106 and admits a request only when current E, joint A, and U serialization are valid.</text><text x="185" y="899" class="ntext">Retry threads, recovery scripts, and old services cannot bypass 105 and submit directly to 110.</text>
<g transform="translate(75 945)"><line x1="0" y1="0" x2="35" y2="0" class="flow"/><text x="46" y="4" class="leg">normal control</text><line x1="160" y1="0" x2="195" y2="0" class="ap"/><text x="206" y="4" class="leg">authorization</text><line x1="330" y1="0" x2="365" y2="0" class="qry"/><text x="376" y="4" class="leg">history or device fact</text></g>
</svg>
