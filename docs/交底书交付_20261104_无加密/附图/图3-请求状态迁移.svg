<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1040" viewBox="0 0 1700 1040" role="img" aria-labelledby="title desc">
<title id="title">图3 请求状态迁移</title>
<desc id="desc">Request states: software accepted, device accepted, started, running, completed, terminated after start, closed before start, unknown, and replacement pending registration.</desc>
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#243746"/></marker>
<marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2f6f9f"/></marker>
<marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3c7d55"/></marker>
<marker id="r" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#a63d40"/></marker>
<style>
.title{font-family:Arial,sans-serif;font-size:29px;font-weight:700;fill:#1f2933}.sub{font-family:Arial,sans-serif;font-size:15px;fill:#52606d}.frame{fill:#fbfcfd;stroke:#d8e0e5;stroke-width:1.5}.box{fill:#fff;stroke:#435563;stroke-width:2}.blue{fill:#f3f8fc;stroke:#2f6f9f;stroke-width:2}.green{fill:#f3f8f5;stroke:#3c7d55;stroke-width:2}.warm{fill:#fffaf0;stroke:#9a7b2f;stroke-width:2}.red{fill:#fff5f4;stroke:#a63d40;stroke-width:2}.t{font-family:Arial,sans-serif;font-size:17px;font-weight:700;fill:#1f2933}.c{font-family:Consolas,"Courier New",monospace;font-size:12px;fill:#52606d}.s{font-family:Arial,sans-serif;font-size:12px;fill:#52606d}.line{fill:none;stroke:#243746;stroke-width:2.3;marker-end:url(#a)}.bl{fill:none;stroke:#2f6f9f;stroke-width:2.3;marker-end:url(#b)}.gr{fill:none;stroke:#3c7d55;stroke-width:2.3;stroke-dasharray:10 4;marker-end:url(#g)}.rd{fill:none;stroke:#a63d40;stroke-width:2.3;stroke-dasharray:9 6;marker-end:url(#r)}.lab{font-family:Arial,sans-serif;font-size:13px;fill:#374957}.labr{font-family:Arial,sans-serif;font-size:13px;fill:#a63d40}.note{fill:#fffdf7;stroke:#d8c27a;stroke-width:1.5}.nt{font-family:Arial,sans-serif;font-size:14px;font-weight:700;fill:#735e24}.nx{font-family:Arial,sans-serif;font-size:13px;fill:#5d5745}.badge{fill:#243746}.bt{font-family:Arial,sans-serif;font-size:12px;font-weight:700;fill:#fff}
</style>
</defs>
<rect width="1700" height="1040" fill="#fff"/>
<text x="850" y="44" text-anchor="middle" class="title">图3 请求状态迁移</text>
<text x="850" y="72" text-anchor="middle" class="sub">软件事实与设备事实分开；已启动不可回退；状态不明不能进入替代</text>
<rect x="55" y="108" width="1590" height="500" rx="12" class="frame"/><text x="82" y="142" class="t">正常执行链</text>
<g transform="translate(85 220)"><rect width="260" height="125" rx="10" class="blue"/><circle cx="23" cy="23" r="16" class="badge"/><text x="23" y="27" text-anchor="middle" class="bt">S1</text><text x="23" y="58" class="t">软件已接收</text><text x="23" y="82" class="c">SOFTWARE_ACCEPTED</text><text x="23" y="105" class="s">仅有软件记录</text></g>
<g transform="translate(405 220)"><rect width="260" height="125" rx="10" class="blue"/><circle cx="23" cy="23" r="16" class="badge"/><text x="23" y="27" text-anchor="middle" class="bt">S2</text><text x="23" y="58" class="t">设备已接收</text><text x="23" y="82" class="c">DEVICE_ACCEPTED</text><text x="23" y="105" class="s">已接收，尚未启动</text></g>
<g transform="translate(725 220)"><rect width="260" height="125" rx="10" class="green"/><circle cx="23" cy="23" r="16" class="badge"/><text x="23" y="27" text-anchor="middle" class="bt">S3</text><text x="23" y="58" class="t">已启动</text><text x="23" y="82" class="c">STARTED</text><text x="23" y="105" class="s">设备侧权威事实</text></g>
<g transform="translate(1045 220)"><rect width="260" height="125" rx="10" class="green"/><circle cx="23" cy="23" r="16" class="badge"/><text x="23" y="27" text-anchor="middle" class="bt">S4</text><text x="23" y="58" class="t">运行中</text><text x="23" y="82" class="c">RUNNING</text><text x="23" y="105" class="s">继续跟踪</text></g>
<path d="M345 282H405" class="bl"/><text x="375" y="272" text-anchor="middle" class="lab">设备接收</text><path d="M665 282H725" class="gr"/><text x="695" y="272" text-anchor="middle" class="lab">启动证据</text><path d="M985 282H1045" class="gr"/><text x="1015" y="272" text-anchor="middle" class="lab">运行中</text>
<g transform="translate(725 440)"><rect width="260" height="125" rx="10" class="green"/><circle cx="23" cy="23" r="16" class="badge"/><text x="23" y="27" text-anchor="middle" class="bt">S5</text><text x="23" y="58" class="t">已完成</text><text x="23" y="82" class="c">COMPLETED</text><text x="23" y="105" class="s">保留启动记录</text></g>
<g transform="translate(1045 440)"><rect width="260" height="125" rx="10" class="red"/><circle cx="23" cy="23" r="16" class="badge"/><text x="23" y="27" text-anchor="middle" class="bt">S6</text><text x="23" y="58" class="t">启动后终止</text><text x="23" y="82" class="c">TERMINATED_AFTER_START</text><text x="23" y="105" class="s">保留启动记录</text></g>
<path d="M1175 345V440" class="gr"/><text x="1192" y="395" class="lab">已完成</text><path d="M1305 345C1380 390 1380 430 1305 440" class="rd"/><text x="1450" y="400" text-anchor="middle" class="labr">启动后故障</text>
<g transform="translate(1360 220)"><rect width="220" height="125" rx="10" class="warm"/><circle cx="23" cy="23" r="16" class="badge"/><text x="23" y="27" text-anchor="middle" class="bt">S7</text><text x="23" y="58" class="t">关闭前未启动</text><text x="23" y="82" class="c">CLOSED_BEFORE_START</text><text x="23" y="105" class="s">以后不能再启动</text></g>
<path d="M665 220C900 145 1260 145 1360 220" class="gr"/><text x="1040" y="155" text-anchor="middle" class="lab">设备确认已关闭且不能再启动</text>
<rect x="55" y="650" width="1590" height="255" rx="12" class="frame"/><text x="82" y="684" class="t">恢复分支</text>
<g transform="translate(110 735)"><rect width="350" height="110" rx="10" class="red"/><circle cx="23" cy="23" r="16" class="badge"/><text x="23" y="27" text-anchor="middle" class="bt">S8</text><text x="23" y="58" class="t">状态不明</text><text x="23" y="82" class="c">UNKNOWN</text><text x="23" y="101" class="s">暂停，不自动替代</text></g>
<g transform="translate(620 735)"><rect width="430" height="110" rx="10" class="warm"/><circle cx="23" cy="23" r="16" class="badge"/><text x="23" y="27" text-anchor="middle" class="bt">S9</text><text x="23" y="58" class="t">替代关系待登记</text><text x="23" y="82" class="c">REPLACED_PENDING_REGISTRATION</text><text x="23" y="101" class="s">关系已写入，R2暂不提交</text></g>
<g transform="translate(1210 735)"><rect width="350" height="110" rx="10" class="blue"/><circle cx="23" cy="23" r="16" class="badge"/><text x="23" y="27" text-anchor="middle" class="bt">D</text><text x="23" y="58" class="t">恢复判定</text><text x="23" y="82" class="c">仅S7可进入替代</text><text x="23" y="101" class="s">仅关闭前未启动</text></g>
<path d="M215 565C215 650 260 690 285 735" class="rd"/><text x="160" y="650" class="labr">查询失败或来源冲突</text><path d="M1470 345C1540 500 1450 650 1385 735" class="gr"/><text x="1500" y="565" class="lab">仅S7</text><path d="M1210 790H1050" class="bl"/><text x="1130" y="780" text-anchor="middle" class="lab">锁定U1后再登记R2</text>
<rect x="55" y="940" width="1590" height="58" rx="8" class="note"/><text x="78" y="964" class="nt">规则:</text><text x="145" y="964" class="nx">软件已接收不等于设备已接收；设备已接收不等于已启动；已启动不能回退；状态不明不能改成未启动。</text><text x="145" y="985" class="nx">未登记不进入设备路径。只有关闭前未启动，且设备确认以后不能再启动，才进入替代。</text>
</svg>
