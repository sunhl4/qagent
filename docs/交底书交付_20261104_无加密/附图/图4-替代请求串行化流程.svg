<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1080" viewBox="0 0 1700 1080" role="img" aria-labelledby="title desc">
<title id="title">图4 替代请求串行化流程</title>
<desc id="desc">Serialized U1 flow: lock, read R1 E2 A2, close device request, persist evidence, recheck authorization, write relation, register R2, release lock; failures pause U1.</desc>
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#243746"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2f6f9f"/></marker><marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3c7d55"/></marker><marker id="r" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#a63d40"/></marker>
<style>
.title{font-family:Arial,sans-serif;font-size:29px;font-weight:700;fill:#1f2933}.sub{font-family:Arial,sans-serif;font-size:15px;fill:#52606d}.frame{fill:#fbfcfd;stroke:#d8e0e5;stroke-width:1.5}.box{fill:#fff;stroke:#435563;stroke-width:2}.blue{fill:#f3f8fc;stroke:#2f6f9f;stroke-width:2}.green{fill:#f3f8f5;stroke:#3c7d55;stroke-width:2}.warm{fill:#fffaf0;stroke:#9a7b2f;stroke-width:2}.red{fill:#fff5f4;stroke:#a63d40;stroke-width:2}.t{font-family:Arial,sans-serif;font-size:17px;font-weight:700;fill:#1f2933}.c{font-family:Consolas,"Courier New",monospace;font-size:12px;fill:#52606d}.s{font-family:Arial,sans-serif;font-size:13px;fill:#52606d}.line{fill:none;stroke:#243746;stroke-width:2.3;marker-end:url(#a)}.bl{fill:none;stroke:#2f6f9f;stroke-width:2.3;marker-end:url(#b)}.gr{fill:none;stroke:#3c7d55;stroke-width:2.3;stroke-dasharray:10 4;marker-end:url(#g)}.rd{fill:none;stroke:#a63d40;stroke-width:2.3;stroke-dasharray:9 6;marker-end:url(#r)}.lab{font-family:Arial,sans-serif;font-size:13px;fill:#374957}.note{fill:#fffdf7;stroke:#d8c27a;stroke-width:1.5}.nt{font-family:Arial,sans-serif;font-size:14px;font-weight:700;fill:#735e24}.nx{font-family:Arial,sans-serif;font-size:13px;fill:#5d5745}.badge{fill:#243746}.bt{font-family:Arial,sans-serif;font-size:14px;font-weight:700;fill:#fff}
</style>
</defs>
<rect width="1700" height="1080" fill="#fff"/>
<text x="850" y="44" text-anchor="middle" class="title">图4 替代请求串行化流程</text>
<text x="850" y="72" text-anchor="middle" class="sub">U1是串行化边界；R1确认关闭且以后不能启动之后才接收R2</text>
<rect x="55" y="108" width="1590" height="825" rx="14" class="frame"/><text x="82" y="145" class="t">执行单元 U1 的保护区</text><text x="82" y="169" class="s">每次持久化写入前复核授权和批准。R2结果不确定时不生成R3。</text>
<g transform="translate(140 215)"><rect width="410" height="88" rx="10" class="blue"/><circle cx="31" cy="44" r="21" class="badge"/><text x="31" y="49" text-anchor="middle" class="bt">1</text><text x="70" y="36" class="t">锁定 U1</text><text x="70" y="61" class="s">互斥、租约或等效串行化</text><text x="70" y="79" class="c">key = task_id + execution_unit_id</text></g><path d="M345 303V342" class="line"/>
<g transform="translate(140 342)"><rect width="410" height="88" rx="10" class="box"/><circle cx="31" cy="44" r="21" class="badge"/><text x="31" y="49" text-anchor="middle" class="bt">2</text><text x="70" y="36" class="t">读取 R1, E2, A2</text><text x="70" y="61" class="s">原状态、当前授权和批准</text><text x="70" y="79" class="c">R1 / authorization_no / approval_id</text></g><path d="M345 430V469" class="line"/>
<g transform="translate(140 469)"><rect width="410" height="88" rx="10" class="blue"/><circle cx="31" cy="44" r="21" class="badge"/><text x="31" y="49" text-anchor="middle" class="bt">3</text><text x="70" y="36" class="t">关闭或取消 R1</text><text x="70" y="61" class="s">以R1原编号关闭或取消</text><text x="70" y="79" class="c">close(R1) -&gt; device evidence</text></g><path d="M345 557V596" class="line"/>
<g transform="translate(140 596)"><rect width="410" height="88" rx="10" class="green"/><circle cx="31" cy="44" r="21" class="badge"/><text x="31" y="49" text-anchor="middle" class="bt">4</text><text x="70" y="36" class="t">持久化关闭证据</text><text x="70" y="61" class="s">未启动且以后不能再启动</text><text x="70" y="79" class="c">CLOSED_BEFORE_START + evidence_ref</text></g><path d="M345 684V723" class="line"/>
<g transform="translate(140 723)"><rect width="410" height="88" rx="10" class="blue"/><circle cx="31" cy="44" r="21" class="badge"/><text x="31" y="49" text-anchor="middle" class="bt">5</text><text x="70" y="36" class="t">复核 E2 和 A2</text><text x="70" y="61" class="s">授权和批准必须仍然匹配</text><text x="70" y="79" class="c">current_E == E2 &amp;&amp; current_A == A2</text></g>
<path d="M550 767H740" class="bl"/><text x="645" y="756" text-anchor="middle" class="lab">复核通过</text>
<g transform="translate(740 723)"><rect width="410" height="88" rx="10" class="warm"/><circle cx="31" cy="44" r="21" class="badge"/><text x="31" y="49" text-anchor="middle" class="bt">6</text><text x="70" y="36" class="t">写入 R1-R2 关系</text><text x="70" y="61" class="s">保留R1历史；R2仍用I1和U1</text><text x="70" y="79" class="c">replaces_request_id = R1</text></g><path d="M945 811V850" class="line"/>
<g transform="translate(740 850)"><rect width="410" height="88" rx="10" class="blue"/><circle cx="31" cy="44" r="21" class="badge"/><text x="31" y="49" text-anchor="middle" class="bt">7</text><text x="70" y="36" class="t">登记 R2，释放 U1</text><text x="70" y="61" class="s">先登记软件接收，再释放控制</text><text x="70" y="79" class="c">register(R2) -&gt; release(U1)</text></g>
<rect x="665" y="215" width="850" height="360" rx="12" fill="#fffafb" stroke="#ead2d4" stroke-width="1.5"/><text x="695" y="251" class="t">失败分支：保留 R1 并暂停 U1</text><text x="695" y="277" class="s">下列失败不覆盖R1，也不生成R3。</text>
<g transform="translate(705 310)"><rect width="350" height="62" rx="8" class="red"/><text x="20" y="26" class="t">未取得锁或租约</text><text x="20" y="48" class="s">没有当前串行化资格</text></g><g transform="translate(1110 310)"><rect width="350" height="62" rx="8" class="red"/><text x="20" y="26" class="t">关闭结果不明</text><text x="20" y="48" class="s">没有不可再启动的证据</text></g><g transform="translate(705 405)"><rect width="350" height="62" rx="8" class="red"/><text x="20" y="26" class="t">E2或A2已变化</text><text x="20" y="48" class="s">当前授权或批准已不匹配</text></g><g transform="translate(1110 405)"><rect width="350" height="62" rx="8" class="red"/><text x="20" y="26" class="t">关系已写、R2未登记</text><text x="20" y="48" class="s">保留待登记，不生成R3</text></g>
<path d="M880 372V405" class="rd"/><path d="M1285 372V405" class="rd"/><path d="M880 467V520H1060" class="rd"/><path d="M1285 467V520H1060" class="rd"/><rect x="830" y="520" width="460" height="62" rx="8" class="red"/><text x="1060" y="547" text-anchor="middle" class="nt">U1暂停</text><text x="1060" y="568" text-anchor="middle" class="nx">保留R1。关系未写成则不登记R2</text>
<path d="M1150 894C1300 894 1310 850 1310 780" class="gr"/><rect x="1220" y="650" width="335" height="120" rx="10" class="green"/><text x="1245" y="680" class="t">R2登记之后</text><text x="1245" y="705" class="s">R2仍须经过量子入口</text><text x="1245" y="727" class="s">并检查当前授权和批准。</text><text x="1245" y="749" class="s">结果不确定时查询R2，不生成R3。</text>
<rect x="55" y="965" width="1590" height="58" rx="8" class="note"/><text x="78" y="989" class="nt">数据规则:</text><text x="160" y="989" class="nx">R1与R2同属I1和U1。R2引用R1的关闭证据和替代原因；R1不删除。</text><text x="160" y="1010" class="nx">通信超时或锁超时既不能证明设备已关闭，也不能证明请求未启动。</text>
</svg>
