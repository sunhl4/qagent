lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      '@unitqc/company-agent-core':
        specifier: file:../../packages/company-agent-core
        version: file:../../packages/company-agent-core
      '@unitqc/company-agent-latex':
        specifier: file:../../packages/company-agent-latex
        version: file:../../packages/company-agent-latex
      '@unitqc/company-agent-literature':
        specifier: file:../../packages/company-agent-literature
        version: file:../../packages/company-agent-literature
      '@unitqc/company-agent-office':
        specifier: file:../../packages/company-agent-office
        version: file:../../packages/company-agent-office
      '@unitqc/company-agent-policy':
        specifier: file:../../packages/company-agent-policy
        version: file:../../packages/company-agent-policy

packages:

  '@unitqc/company-agent-core@file:../../packages/company-agent-core':
    resolution: {directory: ../../packages/company-agent-core, type: directory}

  '@unitqc/company-agent-latex@file:../../packages/company-agent-latex':
    resolution: {directory: ../../packages/company-agent-latex, type: directory}

  '@unitqc/company-agent-literature@file:../../packages/company-agent-literature':
    resolution: {directory: ../../packages/company-agent-literature, type: directory}

  '@unitqc/company-agent-office@file:../../packages/company-agent-office':
    resolution: {directory: ../../packages/company-agent-office, type: directory}

  '@unitqc/company-agent-policy@file:../../packages/company-agent-policy':
    resolution: {directory: ../../packages/company-agent-policy, type: directory}

snapshots:

  '@unitqc/company-agent-core@file:../../packages/company-agent-core': {}

  '@unitqc/company-agent-latex@file:../../packages/company-agent-latex':
    dependencies:
      '@unitqc/company-agent-core': file:../../packages/company-agent-core

  '@unitqc/company-agent-literature@file:../../packages/company-agent-literature':
    dependencies:
      '@unitqc/company-agent-core': file:../../packages/company-agent-core

  '@unitqc/company-agent-office@file:../../packages/company-agent-office':
    dependencies:
      '@unitqc/company-agent-core': file:../../packages/company-agent-core

  '@unitqc/company-agent-policy@file:../../packages/company-agent-policy':
    dependencies:
      '@unitqc/company-agent-core': file:../../packages/company-agent-core
