- insert:
    - id: company-agent-policy
      name: "@unitqc/company-agent-policy"
    - id: company-agent-core
      name: "@unitqc/company-agent-core"
    - id: company-agent-quantum
      name: "@unitqc/company-agent-quantum"
    - id: company-agent-hpc
      name: "@unitqc/company-agent-hpc"
    - id: company-agent-device
      name: "@unitqc/company-agent-device"
    - id: company-agent-latex
      name: "@unitqc/company-agent-latex"
    - id: company-agent-office
      name: "@unitqc/company-agent-office"
    - id: company-agent-plan
      name: "@unitqc/company-agent-plan"
    - id: company-agent-research
      name: "@unitqc/company-agent-research"

- id: subagent-codex
  name: "@deepseek-ai/dsh-subagent-codex"
  config:
    providerName: codex
    # permissionMode: never is the upstream default for 0.1.5-rc.2 — restated
    # here so a later DSH default change cannot silently widen approval, and
    # pinned textually by scripts/verify_dsh_profiles.py (REQUIRED).
    permissionMode: never
    # inheritsParentContext is NOT a config-schema key: the provider hardcodes
    # the capability to false (its CodexProvider class). Stating it here is
    # declarative intent for reviewers and for the same gate pin; the real
    # guarantee lives in the provider + the gate's FORBIDDEN tool checks.
    inheritsParentContext: false

# 受管通用工具行：web bundle 对 base 挂载的整行加 disabled，patch 层整行覆写
# 必须显式 disabled: false 才能重新启用。配置键同步重述，避免丢默认值。
# 只启用合同 managed_builtins 名单内的全部受管工具；不启用任何 shell、
# str-replace 类编辑工具、子代理、workflow、ralph 或 goal。
- id: tool-fs
  disabled: false
  config:
    # 单次 read 返回上限：衔接 contracts/results.json 的输出预算。
    readMaxBytes: 51200

- id: tool-fs-search
  disabled: false
  config:
    sampleOverCapGlobResults: false

- id: tool-web
  disabled: false
  config:
    fetch: false
    searchTimeoutMs: 60000

# 公司本地 DeepSeek 端点（openai-completions 自托管路由），默认常开：
# 不设 apiKeyEnv。当前 DSH 的 OpenAI 兼容协议在既无 apiKeyEnv 也无
# Authorization 时会在发请求前拒绝。Bearer local 只满足该协议，不是密钥；
# 本地服务忽略该头。本地服务要求真实密钥时，改为 apiKeyEnv
# COMPANY_AGENT_LOCAL_MODEL_TOKEN，并删除该占位头。地址不进入模型上下文。
- id: llm-pi-ai
  config:
    providers:
      company-local:
        displayName: Company Local DeepSeek
        api: openai-completions
        baseURL: http://127.0.0.1:8000/v1
        headers:
          Authorization: Bearer local
        models:
          - id: deepseek-chat
      # 内网公司中转（openai-completions 兼容网关）。密钥经 apiKeyEnv 引用
      # 在每请求解析。继承的环境变量优先于 DSH 凭据存储；若希望在
      # Models 页管理密钥，需先停止注入同名 COMPANY_RELAY_API_KEY。
      # 开发环境可由 runtime-dev.env 注入。密钥不进入合同仓或模型上下文。
      # 模型列表来自 2026-10-22 DSH discoverModels 的完整响应，不按厂商
      # 筛选。未披露容量的模型保留适配器缺省值，不推测其真实容量。
      # 后续在原生 Models 页「获取可用模型」并采用新条目，无需重启。
      company-relay:
        displayName: Company Relay (公司中转)
        api: openai-completions
        baseURL: http://192.168.110.150:4000/v1
        apiKeyEnv: COMPANY_RELAY_API_KEY
        models:
          - id: yaozheng-GLM-5.3-Flash
          - id: gpt-6.1-sol
            contextWindow: 922000
            maxTokens: 128000
          - id: gpt-6-astra
            contextWindow: 922000
            maxTokens: 128000
          - id: gpt-6-luna
            contextWindow: 922000
            maxTokens: 128000
          - id: codex-auto-review

# 默认模型路由 company-local / deepseek-chat；官方 DeepSeek 适配器（llm-deepseek）
# 保持挂载，可在 Models 页手动选用。端点不可用时诚实失败，不回退公网。
- id: agent-default-model
  config:
    provider: company-relay
    model: yaozheng-GLM-5.3-Flash

- id: skill-filesystem
  disabled: false
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js process.env.COMPANY_AGENT_SKILL_ROOT
    watch: false

- id: tool-skill
  disabled: false

# 编码和办公共用的会话清单。base 已挂载，web bundle 整行禁用。
# 本组合没有子代理，所以不允许并行 in_progress。
- id: tool-todo
  disabled: false
  config:
    allowParallelInProgress: false

# 办公和代码产物的交付声明。0.1.5-rc.3 的 base 未挂载该行，这里显式加入。
# 结果只回报路径，不复制文件正文。
- id: tool-present
  name: "@deepseek-ai/dsh-tool-present"
  disabled: false
  config:
    maxFiles: 4

- id: agent-presets
  config:
    default: company-agent
    roots:
      - path: !!js process.env.COMPANY_AGENT_PRESET_ROOT
        trust: system
    includeShippedRoot: false
    includeUserRoot: false
