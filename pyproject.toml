[build-system]
requires = ["setuptools>=77,<83", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "unitqc-company-agent"
version = "0.1.0.dev0"
description = "UnitQC company Agent capability and governance layer for DeepSeek Harness"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.9,<1", "build>=1.2,<2", "hypothesis>=6,<7"]

[project.scripts]
company-agent = "company_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/unitqc-company-agent/contracts" = ["contracts/*.json"]
"share/unitqc-company-agent/knowledge" = ["knowledge/*.md", "knowledge/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider -m 'not platform_compatibility and not latex_toolchain and not overleaf_live'"
markers = [
    "platform_compatibility: explicit dual-repository gate; requires COMPANY_AGENT_PLATFORM_SOURCE",
    "latex_toolchain: explicit local TeX toolchain gate for the golden matrix",
    "posix_permissions: release probes that need POSIX chmod bits; skipped on Windows hosts",
    "overleaf_live: explicit live Overleaf bridge e2e; needs COMPANY_AGENT_OVERLEAF_GIT_{BASE,TOKEN}",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
